name: Actualizar índice de activaciones
on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build_index.js
      - name: Commit si hay cambios
        run: |
          # "generated" cambia en cada ejecución: solo se sube si cambia el contenido de las activaciones
          sin_fecha() { sed 's/"generated":"[^"]*"//'; }
          if [ "$(git show HEAD:data/activaciones.json | sin_fecha)" = "$(sin_fecha < data/activaciones.json)" ]; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activaciones.json data/activaciones.js
          git commit -m "Actualiza índice de activaciones"
          git push
