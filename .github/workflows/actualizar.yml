name: Actualizar índice de activaciones
on:
  schedule:
    - cron: "17 5,17 * * *"   # cada 12 horas (05:17 y 17:17 UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build_index.js
      - name: Commit de la comprobación (y del índice si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/estado.json guarda la hora de la última comprobación y se sube siempre
          date -u +'{"comprobado":"%Y-%m-%dT%H:%M:%SZ"}' > data/estado.json
          git add data/estado.json
          # "generated" cambia en cada ejecución: el índice solo se sube si cambia el contenido de las activaciones
          sin_fecha() { sed 's/"generated":"[^"]*"//'; }
          if [ "$(git show HEAD:data/activaciones.json | sin_fecha)" = "$(sin_fecha < data/activaciones.json)" ]; then
            echo "Sin cambios"
            git checkout -- data/activaciones.json data/activaciones.js traducciones.json
            git commit -m "Comprobación sin cambios"
          else
            git add data/activaciones.json data/activaciones.js traducciones.json
            git commit -m "Actualiza índice de activaciones"
          fi
          git push
